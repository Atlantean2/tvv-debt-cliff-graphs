<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechVestVentures Debt Cliff Graphs — Q1</title><link rel="stylesheet" href="../assets/style.css"><script>if(!/[?&]raw/.test(location.search))location.replace("../index.html#Q1")</script></head><body><main id="issue"><h2 class="desk">Q1. US Maturity Wall</h2><div class="wk">Weekly Focus graphs, started Oct 25, 2026: new charts are added each week from primary or clearly named secondary data. Each caption names its sources and its caveats.</div><figure class="g w"><img src="img/W2026-10-25-DC1.webp" alt="US Treasury maturity wall: what must be refinanced, and at what rate" loading="lazy"><figcaption><span class="t">Chart DC1 (week of Oct 25, 2026). US Treasury maturity wall: what must be refinanced, and at what rate</span><p>Marketable Treasury securities outstanding on Sep 30, 2026, by when they mature (Monthly Statement of the Public Debt, security-level table). $10.6 trillion of the $31.8 trillion total comes due within 12 months, mostly bills, which already pay close to current short rates. The cliff is in the notes: the average coupon on notes and bonds maturing in the next 12 months is 2.98%, and 3.11% for the following year, against a 10-year yield near 5% in October. Every rollover at today&#x27;s yields raises the interest bill, which already takes about 21 cents of every federal revenue dollar (see DC2). Face amounts are in millions in the source and converted here; TIPS shown at reported outstanding amount.</p><p>Sources: <a href="https://fiscaldata.treasury.gov/datasets/monthly-statement-public-debt/detail-of-marketable-treasury-securities-outstanding">US Treasury Fiscal Data, MSPD Table 3 (Marketable), Sep 30, 2026</a> <a href="https://fred.stlouisfed.org/series/DGS10">FRED DGS10</a></p></figcaption></figure>
<figure class="g w"><img src="img/W2026-10-30-DC4.webp" alt="Marketable Treasury debt hits $31.8T; bills alone are $7.1T" loading="lazy"><figcaption><span class="t">Chart DC4 (week of Oct 30, 2026). Marketable Treasury debt hits $31.8T; bills alone are $7.1T</span><p>US marketable Treasury debt by security type, monthly to Sep 2026; bills are 22%. Source: Treasury MSPD.</p><ul><li>Sep 30 2026: $31.83T in marketable debt, made up of bills $7.12T, notes $16.28T, bonds $5.55T, TIPS $2.17T and FRNs $0.71T.</li><li>Jan 2001: $2.8T. That is about 11 times as much in 25 years.</li><li>The bills ($7.1T, 22%) roll over within 12 months and reprice at current short rates. This chart complements the existing DC1 wall, which shows $10.6T due within 12 months.</li></ul><p>Sources: <a href="https://fiscaldata.treasury.gov/datasets/monthly-statement-public-debt/summary-of-treasury-securities-outstanding">Treasury Fiscal Data, Monthly Statement of the Public Debt</a> <a href="https://api.fiscaldata.treasury.gov/services/api/fiscal_service/v1/debt/mspd/mspd_table_1">Treasury Fiscal Data API, MSPD Table 1</a></p></figcaption></figure></main></body></html>
