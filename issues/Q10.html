<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechVestVentures Debt Cliff Graphs — Q10</title><link rel="icon" href="../assets/favicon.svg" type="image/svg+xml"><link rel="icon" href="../assets/favicon-32.png" sizes="32x32" type="image/png"><link rel="apple-touch-icon" href="../assets/apple-touch-icon.png"><link rel="stylesheet" href="../assets/style.css"><script>if(!/[?&]raw/.test(location.search))location.replace("../index.html#Q10")</script></head><body><main id="issue"><h2 class="desk">Q10. France OATs</h2><div class="wk">Weekly Focus graphs, started Oct 25, 2026: new charts are added each week from primary or clearly named secondary data. Each caption names its sources and its caveats.</div><figure class="g w"><img src="img/W2026-11-15-DC15.webp" alt="France must roll €1 trillion by 2031, from a 2.2% average coupon into ~4.9% yields" loading="lazy"><figcaption><span class="t">Chart DC15 (week of Nov 15, 2026). France must roll €1 trillion by 2031, from a 2.2% average coupon into ~4.9% yields</span><p>Left: France&#x27;s €2,401 billion of nominal fixed-rate government bonds (OATs) by year of maturity, coloured by coupon (Agence France Trésor detailed outstanding table, accessed Nov 15 2026; inflation-linked OATs not included). €1,055 billion (44%) falls due between now and 2031, and €1,048 billion (44%) carries coupons below 2% — much of it issued at 0–0.75% in 2020–21. The weighted average coupon is 2.16%. Right: monthly 10-year yields (ECB convergence-criterion series). France&#x27;s 10-year averaged 4.89% in October 2026, up from 3.68% in June and above Italy (4.68%). Since the Italian series began in March 1991, France&#x27;s monthly 10-year yield has topped Italy&#x27;s in only six months, all since December 2025; the spread over Germany was 147 bp.</p><ul><li>Largest single maturity years: 2029 €250bn, 2028 €221bn, 2031 €198bn, 2030 €193bn.</li><li>France 10-year monthly averages in 2026: Jun 3.68%, Jul 3.85%, Aug 4.00%, Sep 4.44%, Oct 4.89%.</li><li>Every euro rolled from a sub-1% coupon into a ~4.9% yield multiplies that slice of the interest bill several times over; the effect builds year by year as old bonds mature.</li><li>The counter-argument: the bill rises only gradually because old bonds mature over decades, and the 2029 and 2032 lines with 5.5% and 5.75% coupons will refinance more cheaply. The October jump coincided with the street protest wave shown in the Global Riot R7 and R8 charts.</li></ul><p class="nt">Note: The AFT table lists nominal outstanding by line; amounts are face value and exclude inflation-indexed OATs (OATi/OAT€i) and short-term BTFs. Lines maturing in the same year are summed. The ECB series is a monthly average of secondary-market 10-year benchmark yields. The France-versus-Italy comparison uses the full ECB monthly series (Italy from March 1991).</p><p>Sources: <a href="https://www.aft.gouv.fr/en/encours-detaille-oat">Agence France Trésor: detailed outstanding OATs by line</a> <a href="https://data.ecb.europa.eu/data/datasets/IRS/IRS.M.FR.L.L40.CI.0000.EUR.N.Z">ECB Data Portal: France long-term interest rate (IRS.M.FR.L.L40.CI.0000.EUR.N.Z)</a> <a href="https://data.ecb.europa.eu/data/datasets/IRS/IRS.M.DE.L.L40.CI.0000.EUR.N.Z">ECB Data Portal: Germany long-term interest rate</a> <a href="https://data.ecb.europa.eu/data/datasets/IRS/IRS.M.IT.L.L40.CI.0000.EUR.N.Z">ECB Data Portal: Italy long-term interest rate</a> <a href="https://x.com/ici_officiel/status/2121645680120787114">ICI live: Nov 14 protest turnout (context: France&#x27;s political crisis)</a></p></figcaption></figure></main></body></html>
