<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechVestVentures Debt Cliff Graphs — Q11</title><link rel="icon" href="../assets/favicon.svg" type="image/svg+xml"><link rel="icon" href="../assets/favicon-32.png" sizes="32x32" type="image/png"><link rel="apple-touch-icon" href="../assets/apple-touch-icon.png"><link rel="stylesheet" href="../assets/style.css"><script>if(!/[?&]raw/.test(location.search))location.replace("../index.html#Q11")</script></head><body><main id="issue"><h2 class="desk">Q11. Italy BTP Wall</h2><div class="wk">Weekly Focus graphs, started Oct 25, 2026: new charts are added each week from primary or clearly named secondary data. Each caption names its sources and its caveats.</div><figure class="g w"><img src="img/W2026-11-22-DC16.webp" alt="Italy must refinance €945bn by end-2029, a third of its marketable debt" loading="lazy"><figcaption><span class="t">Chart DC16 (week of Nov 22, 2026). Italy must refinance €945bn by end-2029, a third of its marketable debt</span><p>Italy&#x27;s Treasury (MEF, Direzione Debito Pubblico) lists every outstanding government security by maturity. At Oct 31, 2026, €2,870bn was outstanding after excluding the bills and bonds that already matured this year; €945bn (33%) falls due by the end of 2029 and €375bn within the next 12 months. 2027 is the peak year at €354bn. The fixed-rate BTPs maturing in 2027–29 (€615bn) carry an average coupon of 2.81%, against an Italian 10-year yield of 4.68% in October 2026, so each rollover raises the interest bill unless yields fall. The same wall holds €144bn of short BOT bills, which reprice within a year whatever happens. The other side: the Treasury has lengthened issuance, so about half of the stock matures after 2031, and its retail BTP Valore and BTP Italia issues give it a domestic buyer base beyond banks and foreign funds.</p><ul><li>Maturing by year (€bn, Nov–Dec only for 2026): 2026 68; 2027 354; 2028 273; 2029 250; 2030 254; 2031 263; 2032 191.</li><li>By instrument, all maturities: BOT bills €144bn; Fixed-rate BTP €2,011bn; CCTeu floaters €133bn; Inflation-linked BTP€i €223bn; Retail BTP (Valore, Italia, Più) €186bn; EMTN, foreign-currency and NGEU loans €174bn.</li><li>Average coupon on fixed-rate BTPs maturing 2030 and later: 3.25% (€1,365bn). Inflation-linked amounts are the inflation-revalued values the Treasury reports.</li><li>NGEU rows are Italy&#x27;s scheduled repayments of EU Next Generation EU loans as listed by the Treasury; EMTN are its foreign-law notes.</li></ul><p class="nt">Note: Values are the Treasury&#x27;s &#x27;circolante rivalutato&#x27; (inflation-revalued outstanding). Yields are monthly OECD averages.</p><p>Sources: <a href="https://www.dt.mef.gov.it/export/sites/sitodt/modules/documenti_it/debito_pubblico/scadenze_titoli_suddivise_per_anno/Scadenze-suddivise-per-anno-aggiornamento-al-31-ottobre-2026.csv">MEF Dipartimento del Tesoro: Scadenze suddivise per anno (update to Oct 31, 2026, CSV)</a> <a href="https://www.dt.mef.gov.it/it/debito_pubblico/dati_statistici/scadenze_titoli_suddivise_anno/">MEF: Scadenze suddivise per anno (page)</a> <a href="https://fred.stlouisfed.org/series/IRLTLT01ITM156N">FRED: Italy long-term government bond yield (IRLTLT01ITM156N), OECD</a> <a href="https://fred.stlouisfed.org/series/IRLTLT01DEM156N">FRED: Germany long-term government bond yield (IRLTLT01DEM156N), OECD</a></p></figcaption></figure>
<figure class="g w"><img src="img/W2026-11-22-DC17.webp" alt="Italy faces €375bn of redemptions in the next 12 months, 38% of it in short-term bills" loading="lazy"><figcaption><span class="t">Chart DC17 (week of Nov 22, 2026). Italy faces €375bn of redemptions in the next 12 months, 38% of it in short-term bills</span><p>Month-by-month view of the same Treasury list: €375bn of Italian government securities mature between November 2026 and October 2027, about €31bn a month. The heaviest month is June 2027 at €46bn. BOT bills make up €144bn (38%), most of which the Treasury simply rolls into new bills at each auction; the rest, about €231bn of BTPs, floaters and retail bonds, must be refinanced at today&#x27;s longer-term yields. This is gross refinancing only; new borrowing to cover the budget deficit comes on top.</p><ul><li>By month (€bn): Nov 2026 30; Dec 2026 38; Jan 2027 39; Feb 2027 44; Mar 2027 18; Apr 2027 26; May 2027 10; Jun 2027 46; Jul 2027 23; Aug 2027 44; Sep 2027 28; Oct 2027 30.</li><li>Bills issued after Oct 31, 2026 will add further maturities inside this window; the chart shows only securities already outstanding.</li></ul><p class="nt">Note: Values are the Treasury&#x27;s inflation-revalued outstanding amounts at Oct 31, 2026.</p><p>Sources: <a href="https://www.dt.mef.gov.it/export/sites/sitodt/modules/documenti_it/debito_pubblico/scadenze_titoli_suddivise_per_anno/Scadenze-suddivise-per-anno-aggiornamento-al-31-ottobre-2026.csv">MEF Dipartimento del Tesoro: Scadenze suddivise per anno (update to Oct 31, 2026, CSV)</a> <a href="https://www.dt.mef.gov.it/it/debito_pubblico/dati_statistici/titoli_scadenza_prossimi_12_mesi/">MEF: Titoli in scadenza nei prossimi 12 mesi</a> <a href="https://fred.stlouisfed.org/series/IRLTLT01ITM156N">FRED: Italy long-term government bond yield (IRLTLT01ITM156N), OECD</a></p></figcaption></figure></main></body></html>
