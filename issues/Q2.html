<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechVestVentures Debt Cliff Graphs — Q2</title><link rel="stylesheet" href="../assets/style.css"><script>if(!/[?&]raw/.test(location.search))location.replace("../index.html#Q2")</script></head><body><main id="issue"><h2 class="desk">Q2. Interest Burden</h2><div class="wk">Weekly Focus graphs, started Oct 25, 2026: new charts are added each week from primary or clearly named secondary data. Each caption names its sources and its caveats.</div><figure class="g w"><img src="img/W2026-10-25-DC2.webp" alt="Interest&#x27;s bite: federal interest payments as a share of federal revenue" loading="lazy"><figcaption><span class="t">Chart DC2 (week of Oct 25, 2026). Interest&#x27;s bite: federal interest payments as a share of federal revenue</span><p>Federal interest payments (BEA national accounts) divided by federal current receipts, quarterly since 1947. The ratio has nearly doubled from 12.4% in 2015 to 21.1% in Q2 2026, just below its Q3 2024 peak of 22.0%, the highest since 1997. The record was 28.6% in 1985, when 10-year yields were above 10%; the difference now is that the debt stock is far larger relative to GDP, so each further rate rise bites harder. Only one prior climb of this size (1974-1985) exists in the record, so treat any &#x27;what comes next&#x27; pattern as a single precedent, not a rule.</p><p>Sources: <a href="https://fred.stlouisfed.org/series/A091RC1Q027SBEA">FRED A091RC1Q027SBEA (federal interest payments)</a> <a href="https://fred.stlouisfed.org/series/FGRECPT">FRED FGRECPT (federal current receipts)</a> <a href="https://fred.stlouisfed.org/series/USREC">FRED USREC</a></p></figcaption></figure></main></body></html>
