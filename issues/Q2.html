<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechVestVentures Debt Cliff Graphs — Q2</title><link rel="icon" href="../assets/favicon.svg" type="image/svg+xml"><link rel="icon" href="../assets/favicon-32.png" sizes="32x32" type="image/png"><link rel="apple-touch-icon" href="../assets/apple-touch-icon.png"><link rel="stylesheet" href="../assets/style.css"><script>if(!/[?&]raw/.test(location.search))location.replace("../index.html#Q2")</script></head><body><main id="issue"><h2 class="desk">Q2. Interest Burden</h2><div class="wk">Weekly Focus graphs, started Oct 25, 2026: new charts are added each week from primary or clearly named secondary data. Each caption names its sources and its caveats.</div><figure class="g w"><img src="img/W2026-10-25-DC2.webp" alt="Interest&#x27;s bite: federal interest payments as a share of federal revenue" loading="lazy"><figcaption><span class="t">Chart DC2 (week of Oct 25, 2026). Interest&#x27;s bite: federal interest payments as a share of federal revenue</span><p>Federal interest payments (BEA national accounts) divided by federal current receipts, quarterly since 1947. The ratio has nearly doubled from 12.4% in 2015 to 21.1% in Q2 2026, just below its Q3 2024 peak of 22.0%, the highest since 1997. The record was 28.6% in 1985, when 10-year yields were above 10%; the difference now is that the debt stock is far larger relative to GDP, so each further rate rise bites harder. Only one prior climb of this size (1974-1985) exists in the record, so treat any &#x27;what comes next&#x27; pattern as a single precedent, not a rule.</p><p>Sources: <a href="https://fred.stlouisfed.org/series/A091RC1Q027SBEA">FRED A091RC1Q027SBEA (federal interest payments)</a> <a href="https://fred.stlouisfed.org/series/FGRECPT">FRED FGRECPT (federal current receipts)</a> <a href="https://fred.stlouisfed.org/series/USREC">FRED USREC</a></p></figcaption></figure>
<figure class="g w"><img src="img/W2026-10-30-DC5.webp" alt="US now pays more in interest than on defense: $1.05T vs $965B" loading="lazy"><figcaption><span class="t">Chart DC5 (week of Oct 30, 2026). US now pays more in interest than on defense: $1.05T vs $965B</span><p>Net interest $1,052B vs defense $965B in FY2026; interest first exceeded defense in FY2024. Source: Treasury MTS Table 9.</p><ul><li>FY2026 (ended Sep 30 2026): net interest $1,051.8B vs national defense $965.2B.</li><li>FY2024: interest $881.7B overtook defense ($874.0B) for the first time in this series.</li><li>FY2015: interest was $223.3B, so it has risen 4.7× in 11 years while defense rose 1.6×.</li></ul><p>Sources: <a href="https://fiscaldata.treasury.gov/datasets/monthly-treasury-statement/outlays-of-the-u-s-government">Treasury Fiscal Data, Monthly Treasury Statement outlays</a> <a href="https://api.fiscaldata.treasury.gov/services/api/fiscal_service/v1/accounting/mts/mts_table_9">Treasury Fiscal Data API, MTS Table 9</a></p></figcaption></figure>
<figure class="g w"><img src="img/W2026-10-30-DC6.webp" alt="Treasury&#x27;s average borrowing cost has more than doubled to 3.52%" loading="lazy"><figcaption><span class="t">Chart DC6 (week of Oct 30, 2026). Treasury&#x27;s average borrowing cost has more than doubled to 3.52%</span><p>Average marketable Treasury rate 3.52% (Sep 2026), up from 1.42% (Jan 2022). Sources: Treasury Fiscal Data, FRED.</p><ul><li>Sep 2026 average rate: 3.518%. The Jan 2022 low was 1.42%.</li><li>The 10-year yield was 4.98% on Oct 29 2026, still above the average rate, so as old debt rolls over the average keeps rising.</li><li>Applied to $31.8T of marketable debt, every +1 pt in the average costs about $318B a year. This is arithmetic, not a forecast.</li></ul><p>Sources: <a href="https://fiscaldata.treasury.gov/datasets/average-interest-rates-treasury-securities/">Treasury Fiscal Data, Average Interest Rates on Treasury Securities</a> <a href="https://fred.stlouisfed.org/series/DGS10">FRED series DGS10</a></p></figcaption></figure></main></body></html>
