<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechVestVentures Debt Cliff Graphs — Q3</title><link rel="stylesheet" href="../assets/style.css"><script>if(!/[?&]raw/.test(location.search))location.replace("../index.html#Q3")</script></head><body><main id="issue"><h2 class="desk">Q3. Emerging Markets</h2><div class="wk">Weekly Focus graphs, started Oct 25, 2026: new charts are added each week from primary or clearly named secondary data. Each caption names its sources and its caveats.</div><figure class="g w"><img src="img/W2026-10-25-DC3.webp" alt="Africa&#x27;s Eurobond wall: $43.6bn due by 2030, refinanced at 300-500bp more" loading="lazy"><figcaption><span class="t">Chart DC3 (week of Oct 25, 2026). Africa&#x27;s Eurobond wall: $43.6bn due by 2030, refinanced at 300-500bp more</span><p>The World Bank&#x27;s October 2026 Africa update puts sovereign Eurobond principal maturing in 13 sub-Saharan countries in 2024-2030 at about $43.6bn. South Africa, Ghana and Nigeria carry 56% of it; the other six countries together about $6.9bn (our residual). The heaviest years are 2027 ($6.6bn) and 2029 ($7.5bn). The bank&#x27;s warning is about price, not just size: 2024 reopening bonds yielded 7.1-10.4%, 300-500bp above pre-2022, and carry only 5-6-year tenors, so the cliff comes back sooner. Example: Kenya refinanced a 6.9% coupon bond at 10.4%. Caveat: we could not reach the World Bank report itself, so the figures are as quoted by Punch.</p><p>Sources: <a href="https://punchng.com/nigeria-faces-6-4bn-eurobond-repayment-burden-world-bank/">Punch, &#x27;Nigeria faces $6.4bn Eurobond repayment burden - World Bank&#x27;, Oct 8, 2026</a></p></figcaption></figure></main></body></html>
