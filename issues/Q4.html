<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechVestVentures Debt Cliff Graphs — Q4</title><link rel="stylesheet" href="../assets/style.css"><script>if(!/[?&]raw/.test(location.search))location.replace("../index.html#Q4")</script></head><body><main id="issue"><h2 class="desk">Q4. Corporate &amp; CRE</h2><div class="wk">Weekly Focus graphs, started Oct 25, 2026: new charts are added each week from primary or clearly named secondary data. Each caption names its sources and its caveats.</div><figure class="g w"><img src="img/W2026-10-30-DC7.webp" alt="$875B of commercial &amp; multifamily mortgages mature in 2026" loading="lazy"><figcaption><span class="t">Chart DC7 (week of Oct 30, 2026). $875B of commercial &amp; multifamily mortgages mature in 2026</span><p>$875B (17% of $5.0T) of CRE mortgages mature in 2026; banks hold $396B. MBA survey, balances at Dec 31 2025.</p><ul><li>Feb 9 2026, MBA: $875B matures in 2026, after $957B in 2025; $652B is due in 2027.</li><li>By holder: depositories $396B (21% of their book), CMBS/CLO/ABS $200B (25%), credit companies/warehouse $163B (29%), life insurers $76B (10%) and GSE/FHA $39B (4%).</li><li>Share of balances maturing by property type: hotel 30%, industrial 23%, office 17%.</li></ul><p>Sources: <a href="https://www.mba.org/news-and-research/newsroom/news/2026/02/09/17-percent-of-commercial-and-multifamily-mortgage-balances-to-mature-in-2026">MBA, CRE mortgage maturities 2026 (Feb 9 2026)</a></p></figcaption></figure>
<figure class="g w"><img src="img/W2026-10-30-DC8.webp" alt="Bank delinquencies: cards 2.85%, CRE up to 1.53% from 2022 lows" loading="lazy"><figcaption><span class="t">Chart DC8 (week of Oct 30, 2026). Bank delinquencies: cards 2.85%, CRE up to 1.53% from 2022 lows</span><p>Bank delinquency, Q2 2026: cards 2.85%, CRE 1.53% (0.63% low), business 1.27%. Source: Federal Reserve via FRED.</p><ul><li>Q2 2026: credit cards 2.85%, single-family mortgages 1.86%, CRE ex-farm 1.53%, business loans 1.27%.</li><li>The CRE delinquency rate has more than doubled from its Q3 2022 low of 0.63%.</li><li>For scale, CRE peaked near 8.7% in 2010, so the current level is elevated but far from a GFC-style episode.</li></ul><p>Sources: <a href="https://fred.stlouisfed.org/series/DRCRELEXFACBS">FRED series DRCRELEXFACBS</a> <a href="https://fred.stlouisfed.org/series/DRBLACBS">FRED series DRBLACBS</a> <a href="https://fred.stlouisfed.org/series/DRCCLACBS">FRED series DRCCLACBS</a> <a href="https://fred.stlouisfed.org/series/DRSFRMACBS">FRED series DRSFRMACBS</a> <a href="https://www.federalreserve.gov/releases/chargeoff/">Federal Reserve, charge-off and delinquency rates</a></p></figcaption></figure></main></body></html>
