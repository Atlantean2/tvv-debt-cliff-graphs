<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechVestVentures Debt Cliff Graphs — Q5</title><link rel="stylesheet" href="../assets/style.css"><script>if(!/[?&]raw/.test(location.search))location.replace("../index.html#Q5")</script></head><body><main id="issue"><h2 class="desk">Q5. Debt Levels</h2><div class="wk">Weekly Focus graphs, started Oct 25, 2026: new charts are added each week from primary or clearly named secondary data. Each caption names its sources and its caveats.</div><figure class="g w"><img src="img/W2026-11-01-DC9.webp" alt="France&#x27;s debt (119%) is closing on Italy&#x27;s while Greece and Portugal deleverage" loading="lazy"><figcaption><span class="t">Chart DC9 (week of Nov 1, 2026). France&#x27;s debt (119%) is closing on Italy&#x27;s while Greece and Portugal deleverage</span><p>General government gross debt as % of GDP, Q4 2019 vs Q2 2026 (Eurostat gov_10q_ggdebt, released Oct 21, 2026). France rose +20.9 points to 119.1% (from 115.4% a year earlier); the gap to Italy (139.9%) has narrowed from 36 to 21 points. Belgium (110.2%), Finland, Austria, Poland and Romania also climbed, while Greece (183% to 141%), Portugal, Cyprus and Ireland cut debt sharply.</p><ul><li>Year-on-year (Q2 2025 to Q2 2026): France +3.7 pt, Belgium +3.8, Italy +2.3, Poland +6.7, Germany +2.0, Greece -11.2.</li><li>Rising debt ratios mean larger refinancing walls each year, rolled over at today&#x27;s higher yields rather than the near-zero rates of 2019-2021.</li></ul><p class="nt">Note: Debt-to-GDP is a stock measure; it does not show maturity profile. Greece&#x27;s high ratio is mostly long-dated official-sector loans at low fixed rates, so its refinancing risk is lower than the level suggests.</p><p>Sources: <a href="https://ec.europa.eu/eurostat/databrowser/view/gov_10q_ggdebt/default/table">Eurostat gov_10q_ggdebt, quarterly government debt</a> <a href="https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/gov_10q_ggdebt?format=JSON&amp;lang=EN&amp;unit=PC_GDP&amp;sector=S13&amp;na_item=GD">Eurostat API, gov_10q_ggdebt</a> <a href="https://ec.europa.eu/eurostat/web/euro-indicators">Eurostat euro indicators, government debt Q2 2026 (Oct 21, 2026 release)</a></p></figcaption></figure></main></body></html>
