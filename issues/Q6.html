<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechVestVentures Debt Cliff Graphs — Q6</title><link rel="stylesheet" href="../assets/style.css"><script>if(!/[?&]raw/.test(location.search))location.replace("../index.html#Q6")</script></head><body><main id="issue"><h2 class="desk">Q6. Interest Bite</h2><div class="wk">Weekly Focus graphs, started Oct 25, 2026: new charts are added each week from primary or clearly named secondary data. Each caption names its sources and its caveats.</div><figure class="g w"><img src="img/W2026-11-01-DC10.webp" alt="The cheap-money dividend is over: interest bills are back near 2015 levels" loading="lazy"><figcaption><span class="t">Chart DC10 (week of Nov 1, 2026). The cheap-money dividend is over: interest bills are back near 2015 levels</span><p>General government interest payable as % of GDP, 2015-2025 (Eurostat gov_10a_main, Oct 2026 fiscal notification). The EU-27 bill fell from 2.2% in 2015 to 1.4% in 2021 as old debt was refinanced at near-zero rates, then rose back to 1.9% in 2025. Romania went from 1.1% (2017) to 2.8%, Poland from 1.1% (2021) to 2.5%, France from 1.3% (2020) to 2.2%, now above its 2015 level. Italy still pays the most among large economies (3.8%); Hungary peaked at 4.9% in 2024.</p><ul><li>Germany&#x27;s interest bill nearly doubled from 0.6% (2021) to 1.1% of GDP, but remains the lowest of the large economies.</li><li>Because most sovereign debt is fixed-rate, interest costs keep rising for years after yields jump, as each maturing bond is refinanced. The 2022-2025 rise is still working through.</li></ul><p class="nt">Note: Interest payable is on an accrual (ESA 2010) basis, which differs from cash interest. Inflation-linked debt (large in Italy and France) adds to recorded interest when inflation is high.</p><p>Sources: <a href="https://ec.europa.eu/eurostat/databrowser/view/gov_10a_main/default/table">Eurostat gov_10a_main, government revenue, expenditure and main aggregates</a> <a href="https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/gov_10a_main?format=JSON&amp;lang=EN&amp;unit=PC_GDP&amp;sector=S13&amp;na_item=D41PAY">Eurostat API, interest payable D41PAY</a> <a href="https://ec.europa.eu/eurostat/web/euro-indicators">Eurostat euro indicators, government debt Q2 2026 (Oct 21, 2026 release)</a></p></figcaption></figure></main></body></html>
