<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechVestVentures Debt Cliff Graphs — Q7</title><link rel="stylesheet" href="../assets/style.css"><script>if(!/[?&]raw/.test(location.search))location.replace("../index.html#Q7")</script></head><body><main id="issue"><h2 class="desk">Q7. Japan Maturity Wall</h2><div class="wk">Weekly Focus graphs, started Oct 25, 2026: new charts are added each week from primary or clearly named secondary data. Each caption names its sources and its caveats.</div><figure class="g w"><img src="img/W2026-11-08-DC11.webp" alt="Japan must refinance ¥158 trillion of JGBs in FY2027 alone" loading="lazy"><figcaption><span class="t">Chart DC11 (week of Nov 8, 2026). Japan must refinance ¥158 trillion of JGBs in FY2027 alone</span><p>Scheduled maturity redemptions of Japanese government general bonds, FY2026 initial-budget basis (Ministry of Finance, billion-yen table converted to trillion yen). FY2027 redemptions are ¥158.0 trillion, then ¥109.5T (FY2028), ¥76.3T (FY2029), ¥79.7T (FY2030) and ¥82.7T (FY2031). The five years FY2027–31 total ¥506.1 trillion, 44% of the ¥1,145.4 trillion stock in this table. The next five years (FY2032–36) add another ¥268.8T. A separate MoF chart of the outstanding JGB stock at end-December 2025 puts that stock at ¥1094.49 trillion, with an average remaining maturity of 9 years and 5 months.</p><ul><li>FY2027’s ¥158.0 trillion is 1.4× FY2028 and about 7× a typical year in the 2040s (around ¥22T).</li><li>Two-thirds of the table (68%, ¥775.0T) matures by the end of FY2036.</li><li>End-December 2025 outstanding JGBs were ¥1094.49T, a slightly smaller stock than the FY2026-budget-basis total because the budget table includes planned FY2026 issuance.</li></ul><p class="nt">Note: Japanese fiscal years run April–March (FY2027 is April 2027–March 2028). Figures are scheduled redemptions of general bonds on the FY2026 initial budget basis; further issuance of bonds that mature inside the window will raise later totals. The table does not separately identify holdings by the Bank of Japan, so it is a gross refinancing wall, not the amount that must be placed with private investors.</p><p>Sources: <a href="https://www.mof.go.jp/english/policy/jgbs/reference/Others/syoukan02.pdf">Japan MoF, Term-to-maturity Structure of General Bonds (FY2026 Initial Budget Basis)</a> <a href="https://www.mof.go.jp/jgbs/reference/appendix/maturity.pdf">Japan MoF, Time-to-Maturity Structure of Outstanding JGB (December 2025)</a> <a href="https://www.mof.go.jp/english/policy/jgbs/publication/debt_management_report/2026/esaimu2026-3-ho.pdf">Japan MoF, Debt Management Report 2026 supplement</a></p></figcaption></figure></main></body></html>
