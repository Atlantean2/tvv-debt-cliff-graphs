<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechVestVentures Debt Cliff Graphs — Q9</title><link rel="icon" href="../assets/favicon.svg" type="image/svg+xml"><link rel="icon" href="../assets/favicon-32.png" sizes="32x32" type="image/png"><link rel="apple-touch-icon" href="../assets/apple-touch-icon.png"><link rel="stylesheet" href="../assets/style.css"><script>if(!/[?&]raw/.test(location.search))location.replace("../index.html#Q9")</script></head><body><main id="issue"><h2 class="desk">Q9. Bond Auctions</h2><div class="wk">Weekly Focus graphs, started Oct 25, 2026: new charts are added each week from primary or clearly named secondary data. Each caption names its sources and its caveats.</div><figure class="g w"><img src="img/W2026-11-15-DC14.webp" alt="Seven straight 30-year auctions at 5%+, after none from 2008 through 2025" loading="lazy"><figcaption><span class="t">Chart DC14 (week of Nov 15, 2026). Seven straight 30-year auctions at 5%+, after none from 2008 through 2025</span><p>Top: the high (clearing) yield of every US Treasury 30-year bond auction and reopening since 1995; bottom: the bid-to-cover ratio since 2008 (TreasuryDirect auction records). The last 7 auctions, May through November 2026, all cleared at 5% or higher; before this year the last one at or above 5% was August 2007. The October 8 reopening cleared at 5.618%, the highest 30-year auction yield since August 2000. The November 12 new issue ($25 billion) cleared at 5.441% with a 2.36 bid-to-cover; primary dealers — the banks obliged to bid — were left with 11.4% of the offering, about $2.84 billion.</p><ul><li>30-year auction clearing yields in 2026: Jan 4.83%, Feb 4.75%, Mar 4.87%, Apr 4.88%, May 5.05%, Jun 5.02%, Jul 5.06%, Aug 5.22%, Sep 5.31%, Oct 5.62%, Nov 5.44%.</li><li>Bid-to-cover on Nov 12 was 2.36; X posters cited a 0.4 bp tail versus the when-issued yield and indirect (largely foreign) bidders falling to 68.1% from 72.3%.</li><li>The bearish reading on X is that bonds are &#x27;choking on supply, not inflation&#x27; after a cooler PPI still pushed the 10-year to 5.16% on Nov 13. The other side: November&#x27;s yield was lower than October&#x27;s and demand was only slightly soft.</li><li>Why it matters for debt cliffs: every refinancing at 5%+ replaces debt issued at 1–3% in 2020–21, raising the interest bill for decades.</li></ul><p class="nt">Note: Includes reopenings (terms listed as 29-year 9–11 months). Clearing yield is the highest accepted yield. Dealer share is primary dealers&#x27; competitive awards divided by the offering amount. The bid-to-cover panel starts in 2008 for readability; the full series in the source runs from 1979.</p><p>Sources: <a href="https://www.treasurydirect.gov/TA_WS/securities/search?type=Bond&amp;format=json">TreasuryDirect auction query, all Bond auctions (JSON)</a> <a href="https://www.treasurydirect.gov/instit/annceresult/press/preanre/2026/R_20261112_4.pdf">TreasuryDirect auction results, Nov 12 2026 30-year bond (R_20261112_4)</a> <a href="https://x.com/baseballmuse/status/2121050152131498088">X: auction summary, indirects 68.11% vs 72.32% prior, dealers 11.39% vs 6.79%</a> <a href="https://x.com/clearmarkdaily/status/2121274450389897416">X: &#x27;bonds are choking on supply, not inflation&#x27;</a> <a href="https://x.com/tereasienn/status/2120944753525359045">X: the opposing view, the yield was well below October&#x27;s 5.618%</a></p></figcaption></figure></main></body></html>
